<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Solar System — CSS Visuals</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="title">Interactive Solar System</div>

  <!-- Controls -->
  <div class="controls" aria-hidden="false">
    <label class="control-item">
      Speed
      <input id="speedRange" type="range" min="0.25" max="3" step="0.05" value="1" />
    </label>
    <label class="control-item"><input id="trailsToggle" type="checkbox" /> Trails</label>
    <label class="control-item"><input id="audioToggle" type="checkbox" /> Sound</label>
    <button id="resetView" title="Reset view">Reset</button>
  </div>

  <div class="space" id="space">
    <div class="solar-system" id="solarSystem" aria-hidden="false">

      <!-- Sun -->
      <div class="sun" data-name="Sun" data-fact="The Sun — a massive star; ~1.3 million Earths could fit inside.">
        <div class="tooltip">Sun — star</div>
      </div>

      <!-- Mercury -->
      <div class="orbit mercury-orbit">
        <div class="planet mercury" tabindex="0" data-name="Mercury" data-fact="Mercury — the smallest planet, cratered and rocky.">
          <div class="tooltip">Mercury — small & rocky</div>
        </div>
        <div class="trail"></div>
      </div>

      <!-- Venus -->
      <div class="orbit venus-orbit">
        <div class="planet venus" tabindex="0" data-name="Venus" data-fact="Venus — extremely hot with thick reflective clouds.">
          <div class="tooltip">Venus — hot & cloudy</div>
        </div>
        <div class="trail"></div>
      </div>

      <!-- Earth -->
      <div class="orbit earth-orbit">
        <div class="planet earth" tabindex="0" data-name="Earth" data-fact="Earth — our home, currently the only planet known to support life.">
          <div class="tooltip">Earth — supports life</div>
        </div>
        <div class="trail"></div>
      </div>

      <!-- Mars -->
      <div class="orbit mars-orbit">
        <div class="planet mars" tabindex="0" data-name="Mars" data-fact="Mars — the Red Planet; dusty, cold, with Olympus Mons (giant volcano).">
          <div class="tooltip">Mars — red & dusty</div>
        </div>
        <div class="trail"></div>
      </div>

      <!-- Jupiter -->
      <div class="orbit jupiter-orbit">
        <div class="planet jupiter" tabindex="0" data-name="Jupiter" data-fact="Jupiter — the largest planet with banded cloud layers and the Great Red Spot.">
          <div class="tooltip">Jupiter — giant gas planet</div>
        </div>
        <div class="trail"></div>
      </div>

      <!-- Saturn -->
      
     <div class="orbit saturn-orbit">
        <div class="planet saturn" tabindex="0"
            data-name="Saturn"
            data-fact="Saturn — the gas giant famous for its majestic icy rings.">
          <div class="ring"></div>
          <div class="tooltip">Saturn — the ringed giant 💍</div>
        </div>
      </div>

      <!-- Uranus -->
      <div class="orbit uranus-orbit">
        <div class="planet uranus" tabindex="0" data-name="Uranus" data-fact="Uranus — an ice giant that rotates on its side; pale cyan color.">
          <div class="tooltip">Uranus — tilted ice giant</div>
        </div>
        <div class="trail"></div>
      </div>

      <!-- Neptune -->
      <div class="orbit neptune-orbit">
        <div class="planet neptune" tabindex="0" data-name="Neptune" data-fact="Neptune — deep blue ice giant with supersonic winds.">
          <div class="tooltip">Neptune — deep blue & windy</div>
        </div>
        <div class="trail"></div>
      </div>

    </div>
  </div>

  <!-- Info panel -->
  <div id="infoPanel" class="info-panel hidden" role="dialog" aria-hidden="true">
    <button id="closeInfo" class="close-btn" aria-label="Close">✕</button>
    <div class="info-content">
      <h2 id="infoTitle">Title</h2>
      <p id="infoFact">Fact</p>
      <div class="info-stats">
        <div><strong>Gravity:</strong> <span id="infoGravity">—</span> m/s²</div>
        <div><strong>Radius:</strong> <span id="infoRadius">—</span> km</div>
        <div><strong>Moons:</strong> <span id="infoMoons">—</span></div>
      </div>
      <div style="margin-top:10px">
        <button id="jumpToSim" class="primary">Open Gravity Simulator</button>
      </div>
    </div>
  </div>

  <script src="solar.js"></script>
</body>
</html>
