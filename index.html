<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Solar System 🌌</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="space" class="space">
    <div id="solarSystem" class="solar-system">

      <!-- ☀️ SUN -->
      <div class="sun"
           data-name="Sun"
           data-fact="The Sun — a massive glowing sphere of plasma, 1.3 million Earths could fit inside it!"></div>

      <!-- PLANETS inside orbit wrappers (visual rings kept) -->
      <div class="orbit mercury-orbit">
        <div class="planet mercury" tabindex="0"
             data-name="Mercury"
             data-fact="Mercury is the smallest planet and the closest to the Sun. One day there lasts 59 Earth days."></div>
      </div>

      <div class="orbit venus-orbit">
        <div class="planet venus" tabindex="0"
             data-name="Venus"
             data-fact="Venus, Earth’s twin in size, is covered with thick toxic clouds and hotter than 475°C."></div>
      </div>

      <div class="orbit earth-orbit">
        <div class="planet earth" tabindex="0"
             data-name="Earth"
             data-fact="Earth — our home. Liquid water, life, and a magnetic field."></div>
      </div>

      <div class="orbit mars-orbit">
        <div class="planet mars" tabindex="0"
             data-name="Mars"
             data-fact="Mars — the Red Planet, with Olympus Mons (the tallest volcano)."></div>
      </div>

      <div class="orbit jupiter-orbit">
        <div class="planet jupiter" tabindex="0"
             data-name="Jupiter"
             data-fact="Jupiter — the largest planet with banded cloud layers."></div>
      </div>

      <div class="orbit saturn-orbit">
        <div class="planet saturn" tabindex="0"
             data-name="Saturn"
             data-fact="Saturn — famous for its majestic icy rings."></div>
      </div>

      <div class="orbit uranus-orbit">
        <div class="planet uranus" tabindex="0"
             data-name="Uranus"
             data-fact="Uranus — rotates on its side; pale cyan color."></div>
      </div>

      <div class="orbit neptune-orbit">
        <div class="planet neptune" tabindex="0"
             data-name="Neptune"
             data-fact="Neptune — deep blue ice giant with strong winds."></div>
      </div>

    </div>

    <!-- Controls -->
    <aside class="controls-panel">
      <div class="control-row">
        <label>Orbit Speed
          <input id="speedRange" type="range" min="0.2" max="3" step="0.05" value="1">
        </label>
      </div>
      <div class="control-row">
        <label><input id="trailsToggle" type="checkbox"> Show trails</label>
      </div>
      <div class="control-row">
        <button id="resetView">Reset View</button>
      </div>
      <div class="info-actions">
        <button id="jumpToSim">Open Gravity Simulator</button>
      </div>
    </aside>

    <!-- Info panel -->
    <div id="infoPanel" class="info-panel hidden" aria-hidden="true">
      <button id="closeInfo" class="close-btn">✕</button>
      <h2 id="infoTitle">Planet</h2>
      <p id="infoFact">Select a planet to learn more.</p>
      <ul class="info-list">
        <li>Gravity: <span id="infoGravity">—</span> m/s²</li>
        <li>Radius: <span id="infoRadius">—</span> km</li>
        <li>Moons: <span id="infoMoons">—</span></li>
      </ul>
    </div>
  </div>

  <script src="solar.js" defer></script>
</body>
</html>
